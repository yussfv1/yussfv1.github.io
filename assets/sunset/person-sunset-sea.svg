    <rect x="740" y="566" width="120" height="5" rx="2.5" opacity="0.85"/>
    <rect x="705" y="584" width="190" height="5" rx="2.5" opacity="0.75"/>
    <rect x="752" y="604" width="96" height="5" rx="2.5" opacity="0.7"/>
