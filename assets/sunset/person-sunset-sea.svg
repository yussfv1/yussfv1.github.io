      <stop offset="0.25" stop-color="#ffb468" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff7a50" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="above"><rect width="1600" height="540"/></clipPath>
  </defs>
  <rect width="1600" height="540" fill="url(#sky3)"/>
  <rect width="1600" height="540" fill="url(#glow3)"/>
  <circle cx="800" cy="520" r="100" fill="#fff0c8" clip-path="url(#above)"/>
  <g fill="#9a3f6c" opacity="0.6">
