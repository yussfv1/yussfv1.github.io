    <line x1="26" y1="0" x2="38" y2="0" stroke-width="11"/>
    <line x1="2" y1="-156" x2="0" y2="-98" stroke-width="38"/>
    <line x1="4" y1="-150" x2="24" y2="-104" stroke-width="11"/>
