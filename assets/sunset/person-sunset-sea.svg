<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t3">
  <title id="t3">Человек идёт по берегу моря на закате</title>
  <defs>
    <linearGradient id="sky3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a5e"/>
      <stop offset="0.3" stop-color="#7a3d7a"/>
      <stop offset="0.5" stop-color="#e0606a"/>
      <stop offset="0.6" stop-color="#ffa45a"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c05a6a"/>
      <stop offset="0.5" stop-color="#5e3463"/>
      <stop offset="1" stop-color="#2c1d45"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2038"/>
      <stop offset="1" stop-color="#1c1024"/>
