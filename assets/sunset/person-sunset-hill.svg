<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t1">
  <title id="t1">Человек на холме встречает закат, раскинув руки</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1840"/>
      <stop offset="0.32" stop-color="#5b2a63"/>
      <stop offset="0.55" stop-color="#b8435f"/>
      <stop offset="0.72" stop-color="#ee7a4c"/>
      <stop offset="0.85" stop-color="#fbb55e"/>
    </linearGradient>
    <radialGradient id="glow" cx="1060" cy="640" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff1c4" stop-opacity="0.95"/>
      <stop offset="0.25" stop-color="#ffc874" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff8a4c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6d8"/>
      <stop offset="1" stop-color="#ffc35e"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <circle cx="1060" cy="650" r="125" fill="url(#sun)"/>
  <!-- облака -->
  <g fill="#7a2f5e" opacity="0.55">
    <rect x="180" y="250" width="420" height="14" rx="7"/>
    <rect x="260" y="276" width="300" height="10" rx="5"/>
    <rect x="1120" y="190" width="380" height="12" rx="6"/>
    <rect x="1040" y="214" width="260" height="9" rx="4.5"/>
  </g>
  <g fill="#f08a5c" opacity="0.6">
    <rect x="820" y="560" width="520" height="8" rx="4"/>
    <rect x="900" y="584" width="330" height="6" rx="3"/>
  </g>
  <!-- дальние холмы -->
  <path d="M0 700 C 220 640 380 660 560 690 S 900 720 1100 680 S 1440 640 1600 670 V 900 H 0 Z" fill="#b4506a"/>
  <path d="M0 760 C 260 720 480 735 700 760 S 1150 790 1400 750 S 1560 735 1600 740 V 900 H 0 Z" fill="#6a2a4f"/>
  <!-- ближний холм с человеком -->
  <path d="M0 900 V 800 C 180 760 380 700 560 692 C 740 686 900 740 1080 800 C 1240 850 1420 860 1600 850 V 900 Z" fill="#251630"/>
  <!-- человек: руки вверх -->
  <g transform="translate(560 694)" fill="#251630" stroke="#251630" stroke-linecap="round">
    <line x1="-8" y1="-92" x2="-15" y2="0" stroke-width="17"/>
    <line x1="8" y1="-92" x2="17" y2="0" stroke-width="17"/>
    <line x1="0" y1="-158" x2="0" y2="-100" stroke-width="40"/>
    <line x1="-14" y1="-160" x2="-62" y2="-222" stroke-width="12"/>
    <line x1="14" y1="-160" x2="62" y2="-222" stroke-width="12"/>
    <line x1="0" y1="-178" x2="0" y2="-168" stroke-width="12"/>
    <circle cx="0" cy="-194" r="17" stroke="none"/>
  </g>
  <!-- трава на холме -->
  <g stroke="#251630" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M300 732 l -6 -22 M306 730 l 4 -18 M470 703 l -4 -16 M478 702 l 6 -20 M650 700 l -3 -18 M658 702 l 7 -15 M820 728 l -5 -20 M828 731 l 4 -16"/>
  </g>
  <!-- птицы -->
  <g stroke="#2b1836" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M820 330 q 14 -12 26 0 q 12 -12 26 0"/>
    <path d="M900 290 q 10 -9 19 0 q 9 -9 19 0"/>
    <path d="M760 380 q 8 -7 15 0 q 7 -7 15 0"/>
  </g>
</svg>
